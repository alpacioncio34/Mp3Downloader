<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio MP3 de cualquier vídeo corto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #e9ecff;
      --ink: #15133b;
      --muted: #5b5a85;
      --blue: #3a37ff;
      --pink: #ff5c8a;
      --card: #ffffff;
      --line: #cfd3f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #12113a;
        --ink: #eceaff;
        --muted: #a3a1d6;
        --blue: #7b79ff;
        --card: #1c1b4d;
        --line: #34337a;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    main { width: 100%; max-width: 640px; }

    /* Onda: el elemento memorable de la página */
    .wave {
      display: flex; align-items: center; justify-content: space-between;
      height: 96px; margin-bottom: 28px; gap: 4px;
    }
    .wave i {
      flex: 1; border-radius: 99px; background: var(--blue);
      height: var(--h); transform-origin: center;
    }
    .wave i:nth-child(3n) { background: var(--pink); }
    .loading .wave i { animation: bounce .9s ease-in-out infinite alternate; animation-delay: var(--d); }
    @keyframes bounce { from { transform: scaleY(.25); } to { transform: scaleY(1.15); } }

    h1 {
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      line-height: 1.02; font-weight: 800; letter-spacing: -.03em;
      margin: 0 0 12px;
    }
    .lead { color: var(--muted); font-size: 1.05rem; margin: 0 0 28px; max-width: 46ch; }

    form {
      display: flex; gap: 8px; background: var(--card);
      border: 2px solid var(--line); border-radius: 18px; padding: 8px;
      transition: border-color .15s;
    }
    form:focus-within { border-color: var(--blue); }
    input[type="url"] {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
      color: var(--ink); font: inherit; font-size: 1rem; padding: 12px 14px;
    }
    input::placeholder { color: var(--muted); opacity: .8; }
    button {
      border: 0; border-radius: 12px; padding: 0 22px; cursor: pointer;
      background: var(--blue); color: #fff; font: inherit; font-weight: 600; font-size: 1rem;
      transition: transform .1s, filter .15s;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .6; cursor: progress; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

    .hint { margin: 12px 4px 0; font-size: .92rem; color: var(--muted); min-height: 1.4em; }
    .hint.error { color: #e0245e; font-weight: 600; }
    .hint.ok { color: var(--blue); font-weight: 600; }

    .result {
      display: none; margin-top: 24px; background: var(--card);
      border: 2px solid var(--line); border-radius: 18px; overflow: hidden;
    }
    .result.show { display: flex; }
    .result img { width: 96px; height: 128px; object-fit: cover; background: var(--line); flex-shrink: 0; }
    .result .body { padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
    .result h2 {
      margin: 0; font-size: 1.05rem; font-weight: 600; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .result p { margin: 0; color: var(--muted); font-size: .92rem; }
    .result a { color: var(--blue); font-weight: 600; font-size: .95rem; margin-top: 6px; }

    @media (max-width: 480px) {
      form { flex-direction: column; }
      button { padding: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading .wave i { animation: none; }
    }
  </style>
</head>
<body>
  <main id="app">
    <div class="wave" id="wave" aria-hidden="true"></div>

    <h1>Saca el audio de cualquier vídeo corto</h1>
    <p class="lead">Pega el enlace de un Short, un Reel o un TikTok y descarga el MP3.</p>

    <!-- Sin JavaScript también funciona: envía el formulario a /download -->
    <form id="form" action="/download" method="get">
      <input id="url" name="url" type="url" required autocomplete="off" inputmode="url"
             placeholder="Enlace del Short, Reel o TikTok" aria-label="Enlace del vídeo">
      <button id="btn" type="submit">Descargar MP3</button>
    </form>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>

    <section class="result" id="result" aria-live="polite">
      <img id="thumb" alt="">
      <div class="body">
        <h2 id="title"></h2>
        <p id="meta"></p>
        <a id="again" href="#">Descargar otra vez</a>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const app = $("app"), form = $("form"), input = $("url"), btn = $("btn"), hint = $("hint");

    // Onda decorativa con alturas repetibles
    const wave = $("wave");
    for (let i = 0; i < 36; i++) {
      const el = document.createElement("i");
      const h = 18 + Math.abs(Math.sin(i * 1.7) * Math.cos(i * 0.45)) * 78;
      el.style.setProperty("--h", h + "%");
      el.style.setProperty("--d", (i % 9) * 0.08 + "s");
      wave.appendChild(el);
    }

    const PLATFORMS = [
      [/youtube\.com|youtu\.be/i, "YouTube Shorts"],
      [/tiktok\.com/i, "TikTok"],
      [/instagram\.com/i, "Instagram Reels"],
    ];
    const platformOf = (u) => (PLATFORMS.find(([re]) => re.test(u)) || [])[1];

    const say = (msg, kind = "") => { hint.textContent = msg; hint.className = "hint " + kind; };
    const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

    input.addEventListener("input", () => {
      const p = platformOf(input.value);
      say(p ? `${p} detectado` : "", p ? "ok" : "");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = input.value.trim();
      if (!platformOf(url)) return say("Ese enlace no es de YouTube, TikTok ni Instagram.", "error");

      const dl = `/download?url=${encodeURIComponent(url)}`;
      btn.disabled = true;
      app.classList.add("loading");
      $("result").classList.remove("show");
      say("Leyendo el vídeo…");

      try {
        const r = await fetch(`/info?url=${encodeURIComponent(url)}`);
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "No se pudo leer el vídeo.");

        $("thumb").src = data.thumbnail || "";
        $("title").textContent = data.title;
        $("meta").textContent = [data.author, data.duration && fmt(data.duration)].filter(Boolean).join(" · ");
        $("again").href = dl;
        $("result").classList.add("show");

        say("Preparando el MP3… la descarga empieza en el navegador.", "ok");
        window.location.assign(dl);
        setTimeout(() => { app.classList.remove("loading"); btn.disabled = false; say("Listo. Mira tus descargas."); }, 6000);
      } catch (err) {
        app.classList.remove("loading");
        btn.disabled = false;
        say(err.message || "No se pudo conectar con el servidor.", "error");
      }
    });
  </script>
</body>
</html>
